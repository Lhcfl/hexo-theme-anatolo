name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build_unit_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/setup@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Configure Hexo Unit Test # 配置 Hexo 单元测试
        run: |
          git clone https://github.com/hexojs/hexo-theme-unit-test.git ~/unit_test
          mkdir -p ~/unit_test/themes/Anatolo
          cp -r ./* ~/unit_test/themes/Anatolo/
          cp -r ./.github/asserts/* ~/unit_test/themes/Anatolo/

          cd ~/unit_test/themes/Anatolo
          pnpm i

          cd ~/unit_test
          npm install
          npm install hexo-renderer-pug --save

          npx hexo new "Anatolo简介"
          cat /home/runner/work/hexo-theme-anatolo/hexo-theme-anatolo/README.md >> ./source/_posts/Anatolo简介.md

      - name: Generate Hexo Unit Test
        run: |
          cd ~/unit_test
          npx hexo g -b

      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v5
        with:
          path: ~/unit_test/public
          

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    runs-on: ubuntu-latest
    needs: build_unit_test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4